name: Daily Scan and Report

on:
  schedule:
    # 11:02 UTC = 4:32 PM IST, Monday-Friday.
    # Why this time, not 3:45 PM: NSE closes 3:30 PM IST, and Yahoo's backend
    # doesn't always finish finalizing every stock's end-of-day bar right away -
    # running too soon after close risks incomplete/NaN last-day data (the exact
    # bug market_scanner.py's dropna fix now handles, but less of it happening
    # in the first place is better). An hour's buffer gives Yahoo time to settle.
    # Why not later: US markets open 7:00 PM IST (9:30 AM ET) - Yahoo's global
    # traffic rises once US trading is live, so finishing before then avoids
    # competing with that load. 4:00-6:30 PM IST is a comparatively quiet window.
    # Why :02 and not :00/:15/:30/:45: scheduled jobs across ALL of GitHub
    # Actions cluster at round times, which can delay your run during peak load -
    # an off-round minute avoids that queue.
    - cron: '2 11 * * 1-5'
  workflow_dispatch: {}

jobs:
  scan-and-report:
    runs-on: ubuntu-latest
    # This daily run intentionally uses bse1000_clean.csv (~1,000 curated BSE
    # 1000 index stocks), NOT bse_full_universe.csv (~4,700+ stocks) - the full
    # universe is much slower and hits Yahoo's rate limiter far more often; it's
    # meant for occasional manual deep-dives, not this daily schedule. See
    # COMMAND_REFERENCE.txt for the full routine-vs-occasional breakdown.
    # 90 min covers normal runs plus a couple of rate-limit-guard cooldowns.
    timeout-minutes: 90
    defaults:
      run:
        working-directory: Scanner
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: Scanner/requirements.txt

      - name: Install dependencies
        run: |
          pip install yfinance pandas openpyxl numpy requests scikit-learn
          pip install opencv-python-headless scipy

      # Each scanner writes its own dated sheet into the SAME trading_toolkit.xlsx.
      # They run sequentially in one job so the file changes carry forward from
      # one step to the next — running them as separate parallel workflows would
      # each start from a fresh checkout and never see each other's sheets.

      - name: Run NSE main scan (market_scanner.py)
        run: python market_scanner.py trading_toolkit.xlsx nifty500.csv niftysmallcap250.csv bse_smallcap250_clean.csv

      - name: Run BSE gainer scan
        run: python bse_gainer_scanner.py trading_toolkit.xlsx bse_smallcap250_clean.csv

      - name: Run BSE 1000 scan (chart patterns + Ultra Top Picks)
        run: python bse1000_scanner.py trading_toolkit.xlsx bse1000_clean.csv

      - name: Send consolidated email report
        if: always()   # still try to email whatever succeeded, even if one scanner above failed
        env:
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_RECIPIENT: sa2337308@gmail.com
        run: python send_scan_report.py trading_toolkit.xlsx

      - name: Upload updated workbook as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trading_toolkit
          path: Scanner/trading_toolkit.xlsx
          retention-days: 14
