name: Daily Scan and Report

on:
  #schedule:
    # 11:02 UTC = 4:32 PM IST, Monday-Friday.
    #- cron: '2 11 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-stock-scan
  cancel-in-progress: true

env:
  TZ: Asia/Kolkata
  PYTHONUNBUFFERED: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  scan-and-report:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    defaults:
      run:
        shell: bash
        working-directory: Scanner

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Scanner/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install scipy opencv-python-headless scikit-learn pytest

      - name: Create a fresh workbook for today
        id: prepare_workbook
        run: |
          REPORT_DATE="$(date +'%Y-%m-%d')"
          REPORT_FILE="daily_reports/trading_toolkit_${REPORT_DATE}.xlsx"

          mkdir -p daily_reports
          cp trading_toolkit.xlsx "$REPORT_FILE"

          python - "$REPORT_FILE" <<'PY'
          import sys
          from pathlib import Path
          from openpyxl import load_workbook

          report_path = Path(sys.argv[1])
          dynamic_prefixes = (
              "Scan_",
              "BSEGain_",
              "BSE1000_",
              "GroupAB_",
              "Explosive_",
              "EarlySwing_",
          )

          workbook = load_workbook(report_path)
          removed = []
          for sheet_name in list(workbook.sheetnames):
              if sheet_name.startswith(dynamic_prefixes):
                  del workbook[sheet_name]
                  removed.append(sheet_name)

          if not workbook.sheetnames:
              workbook.create_sheet("Daily Report")

          workbook.save(report_path)
          print(f"Fresh workbook created: {report_path}")
          print(f"Removed old scanner sheets: {removed or 'none'}")
          print(f"Retained template sheets: {workbook.sheetnames}")
          PY

          echo "report_date=$REPORT_DATE" >> "$GITHUB_OUTPUT"
          echo "report_file=$REPORT_FILE" >> "$GITHUB_OUTPUT"
          echo "report_name=trading_toolkit_${REPORT_DATE}" >> "$GITHUB_OUTPUT"

      # This cache is useful for manual re-runs on the same day. The scanner
      # itself rejects cache data older than its configured freshness window.
      - name: Restore Group A/B price cache
        uses: actions/cache@v4
        with:
          path: Scanner/group_ab_price_cache.pkl
          key: group-ab-price-${{ runner.os }}-${{ steps.prepare_workbook.outputs.report_date }}-${{ hashFiles('Scanner/Group_A.csv', 'Scanner/Group_B.csv', 'Scanner/group_ab_scanner.py') }}
          restore-keys: |
            group-ab-price-${{ runner.os }}-${{ steps.prepare_workbook.outputs.report_date }}-


      - name: Restore Early Swing history and alert state
        uses: actions/cache@v4
        with:
          path: |
            Scanner/.early_swing_cache
            Scanner/early_swing_alert_state.json
          key: early-swing-state-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            early-swing-state-${{ runner.os }}-

      - name: Validate Group A/B scanner and universe
        run: |
          python -m py_compile group_ab_scanner.py
          python - <<'PY'
          from group_ab_scanner import load_group_ab_universe

          records = load_group_ab_universe("Group_A.csv", "Group_B.csv")
          if len(records) < 1000:
              raise SystemExit(f"Unexpectedly small Group A/B universe: {len(records)}")

          invalid = [
              record for record in records
              if record.security_id.upper().startswith("INE")
              or record.yahoo_ticker.upper().startswith("INE")
          ]
          if invalid:
              sample = [(r.symbol, r.security_id, r.yahoo_ticker) for r in invalid[:5]]
              raise SystemExit(f"ISIN values are still being used as Yahoo tickers: {sample}")

          print(f"Validated {len(records)} unique Group A/B securities")
          print("Sample ticker resolution:")
          for record in records[:5]:
              print(f"  {record.symbol} | {record.name} | {record.yahoo_ticker}")
          PY

      - name: Run NSE main scanner and Explosive Engine
        continue-on-error: true
        env:
          REPORT_FILE: ${{ steps.prepare_workbook.outputs.report_file }}
        run: |
          python market_scanner.py "$REPORT_FILE" \
            nifty500.csv \
            niftysmallcap250.csv \
            bse_smallcap250_clean.csv

      - name: Run BSE gainer scanner and Explosive Engine
        continue-on-error: true
        env:
          REPORT_FILE: ${{ steps.prepare_workbook.outputs.report_file }}
        run: |
          python bse_gainer_scanner.py "$REPORT_FILE" \
            bse_smallcap250_clean.csv

      - name: Run BSE 1000 scanner and Explosive Engine
        continue-on-error: true
        env:
          REPORT_FILE: ${{ steps.prepare_workbook.outputs.report_file }}
        run: |
          python bse1000_scanner.py "$REPORT_FILE" \
            bse1000_clean.csv

      - name: Run full BSE Group A/B scanner and Explosive Engine
        continue-on-error: true
        env:
          REPORT_FILE: ${{ steps.prepare_workbook.outputs.report_file }}
          GROUP_AB_BATCH_SIZE: '80'
          GROUP_AB_WORKERS: '8'
          GROUP_AB_EXPLOSIVE_LIMIT: '30'
          GROUP_AB_MAX_SYMBOLS: '0'
          GROUP_AB_CACHE_HOURS: '10'
        run: |
          python group_ab_scanner.py "$REPORT_FILE" \
            Group_A.csv \
            Group_B.csv \
            --batch-size 80 \
            --workers 8 \
            --explosive-limit 30


      - name: Run Early Swing Rally Scanner Phase 2/3
        continue-on-error: true
        env:
          REPORT_FILE: ${{ steps.prepare_workbook.outputs.report_file }}
        run: |
          python early_swing_scanner.py "$REPORT_FILE" \
            bse1000_clean.csv \
            Group_A.csv \
            Group_B.csv \
            --calibration-file early_swing_calibration.json \
            --alert-state-file early_swing_alert_state.json \
            --alert-output early_swing_alerts.csv \
            --batch-size 80 \
            --workers 8

      - name: Verify final workbook sheets
        if: always()
        env:
          REPORT_FILE: ${{ steps.prepare_workbook.outputs.report_file }}
        run: |
          python - "$REPORT_FILE" <<'PY'
          import sys
          from pathlib import Path
          from openpyxl import load_workbook

          report_path = Path(sys.argv[1])
          if not report_path.exists():
              raise SystemExit(f"Report workbook was not created: {report_path}")

          workbook = load_workbook(report_path, read_only=True, data_only=False)
          print(f"Final workbook: {report_path}")
          print("Sheets:")
          for sheet_name in workbook.sheetnames:
              print(f"  - {sheet_name}")

          required_prefixes = ("Scan_", "BSEGain_", "BSE1000_", "GroupAB_", "EarlySwing_")
          missing = [
              prefix for prefix in required_prefixes
              if not any(name.startswith(prefix) for name in workbook.sheetnames)
          ]
          if missing:
              raise SystemExit(f"Missing expected scanner sheet prefix(es): {missing}")
          PY

      - name: Send consolidated email report
        if: always()
        env:
          REPORT_FILE: ${{ steps.prepare_workbook.outputs.report_file }}
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          REPORT_RECIPIENT: sa2337308@gmail.com
        run: python send_scan_report.py "$REPORT_FILE"

      - name: Upload fresh daily workbook
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare_workbook.outputs.report_name }}
          path: |
            Scanner/${{ steps.prepare_workbook.outputs.report_file }}
            Scanner/early_swing_alerts.csv
            Scanner/early_swing_failed_symbols.csv
          if-no-files-found: error
          retention-days: 30
