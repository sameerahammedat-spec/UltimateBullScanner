name: Daily Scan and Report

on:
  schedule:
    # 11:02 UTC = 4:32 PM IST, Monday-Friday.
    # This gives Yahoo Finance time to finalize Indian-market daily candles.
    - cron: '2 11 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

env:
  TZ: Asia/Kolkata
  PYTHONUNBUFFERED: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  scan-and-report:
    runs-on: ubuntu-latest
    # NSE + BSE 1000 + BSE gainers + Group A/B, including the integrated
    # Explosive Engine, can take considerably longer than the old 3-scanner job.
    timeout-minutes: 300

    defaults:
      run:
        shell: bash
        working-directory: Scanner

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Scanner/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install scipy opencv-python-headless scikit-learn

      - name: Create a fresh workbook for today
        id: prepare_workbook
        run: |
          REPORT_DATE="$(date +'%Y-%m-%d')"
          REPORT_FILE="daily_reports/trading_toolkit_${REPORT_DATE}.xlsx"

          mkdir -p daily_reports
          cp trading_toolkit.xlsx "$REPORT_FILE"

          # Keep reusable template sheets, but remove every old dated scanner
          # sheet so this workbook contains only today's generated scan sheets.
          python - "$REPORT_FILE" <<'PY'
          import sys
          from pathlib import Path
          from openpyxl import load_workbook

          report_path = Path(sys.argv[1])
          dynamic_prefixes = (
              "Scan_",
              "BSEGain_",
              "BSE1000_",
              "GroupAB_",
              "Explosive_",
          )

          workbook = load_workbook(report_path)
          removed = []
          for sheet_name in list(workbook.sheetnames):
              if sheet_name.startswith(dynamic_prefixes):
                  del workbook[sheet_name]
                  removed.append(sheet_name)

          if not workbook.sheetnames:
              workbook.create_sheet("Daily Report")

          workbook.save(report_path)
          print(f"Fresh workbook created: {report_path}")
          print(f"Removed old scanner sheets: {removed or 'none'}")
          print(f"Retained template sheets: {workbook.sheetnames}")
          PY

          echo "report_date=$REPORT_DATE" >> "$GITHUB_OUTPUT"
          echo "report_file=$REPORT_FILE" >> "$GITHUB_OUTPUT"
          echo "report_name=trading_toolkit_${REPORT_DATE}" >> "$GITHUB_OUTPUT"

      # Each scanner writes to the SAME fresh daily workbook. Explosive Engine
      # execution is already integrated inside market_scanner.py,
      # bse_gainer_scanner.py, bse1000_scanner.py and group_ab_scanner.py.

      - name: Run NSE main scanner and Explosive Engine
        continue-on-error: true
        env:
          REPORT_FILE: ${{ steps.prepare_workbook.outputs.report_file }}
        run: |
          python market_scanner.py "$REPORT_FILE" \
            nifty500.csv \
            niftysmallcap250.csv \
            bse_smallcap250_clean.csv

      - name: Run BSE gainer scanner and Explosive Engine
        continue-on-error: true
        env:
          REPORT_FILE: ${{ steps.prepare_workbook.outputs.report_file }}
        run: |
          python bse_gainer_scanner.py "$REPORT_FILE" \
            bse_smallcap250_clean.csv

      - name: Run BSE 1000 scanner and Explosive Engine
        continue-on-error: true
        env:
          REPORT_FILE: ${{ steps.prepare_workbook.outputs.report_file }}
        run: |
          python bse1000_scanner.py "$REPORT_FILE" \
            bse1000_clean.csv

      - name: Run BSE Group A/B scanner and Explosive Engine
        continue-on-error: true
        env:
          REPORT_FILE: ${{ steps.prepare_workbook.outputs.report_file }}
        run: |
          python group_ab_scanner.py "$REPORT_FILE" \
            Group_A.csv \
            Group_B.csv

      - name: Show final workbook sheets
        if: always()
        env:
          REPORT_FILE: ${{ steps.prepare_workbook.outputs.report_file }}
        run: |
          python - "$REPORT_FILE" <<'PY'
          import sys
          from pathlib import Path
          from openpyxl import load_workbook

          report_path = Path(sys.argv[1])
          if not report_path.exists():
              raise SystemExit(f"Report workbook was not created: {report_path}")

          workbook = load_workbook(report_path, read_only=True, data_only=False)
          print(f"Final workbook: {report_path}")
          print("Sheets:")
          for sheet_name in workbook.sheetnames:
              print(f"  - {sheet_name}")
          PY

      - name: Send consolidated email report
        if: always()
        env:
          REPORT_FILE: ${{ steps.prepare_workbook.outputs.report_file }}
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_RECIPIENT: sa2337308@gmail.com
        run: python send_scan_report.py "$REPORT_FILE"

      - name: Upload fresh daily workbook
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare_workbook.outputs.report_name }}
          path: Scanner/${{ steps.prepare_workbook.outputs.report_file }}
          if-no-files-found: error
          retention-days: 30
