name: Monthly Universe Refresh

on:
  schedule:
    # 02:30 UTC on the 1st of each month = 8:00 AM IST
    - cron: '30 2 1 * *'
  workflow_dispatch: {}

permissions:
  contents: write   # needed to commit the refreshed CSVs back to the repo

jobs:
  refresh:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Scanner
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Refresh NSE universe lists
        run: python refresh_universe.py

      - name: Commit refreshed files (if changed)
        run: |
          git config user.name "market-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add nifty500.csv niftysmallcap250.csv
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Monthly universe refresh $(date +%Y-%m-%d)"
          git push

      - name: Reminder about BSE Smallcap list
        run: |
          echo "::notice::bse_smallcap250.csv was NOT auto-refreshed - BSE blocks scripted downloads."
          echo "::notice::See GETTING_BSE_SMALLCAP_LIST.md for the manual ~2-minute export if it's been a while."
