name: Afternoon Fresh Move Alerts

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: afternoon-fresh-move-${{ github.ref }}
  cancel-in-progress: false

jobs:
  afternoon-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 100

    defaults:
      run:
        working-directory: Scanner

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Scanner/requirements.txt

      - name: Install scanner dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile scanner
        run: python -m py_compile afternoon_fresh_move_scanner.py

      - name: Run 50-stock test
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PYTHONUNBUFFERED: '1'
        run: |
          python afternoon_fresh_move_scanner.py \
            --watch \
            --limit 50 \
            --group-a Group_A.csv \
            --group-b Group_B.csv \
            --smallcap bse_smallcap250_clean.csv \
            --output-dir afternoon_reports

      - name: Upload afternoon scan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: afternoon-fresh-moves-${{ github.run_id }}
          path: Scanner/afternoon_reports/
          if-no-files-found: warn
          retention-days: 30