name: Daily BSE Gainer Scan

on:
  schedule:
    # 10:15 UTC = 3:45 PM IST, Monday-Friday (before the main 4 PM report)
    - cron: '15 10 * * 1-5'
  workflow_dispatch: {}

jobs:
  bse-gainers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install yfinance pandas openpyxl numpy

      - name: Run BSE gainer scan
        run: python bse_gainer_scanner.py trading_toolkit.xlsx bse_smallcap250.csv

      - name: Upload updated workbook as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trading_toolkit_bse
          path: trading_toolkit.xlsx
          retention-days: 14
