
name: Afternoon Fresh Move - Full Universe Test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: afternoon-fresh-move-full-${{ github.ref }}
  cancel-in-progress: false

jobs:
  afternoon-scan:
    name: afternoon-scan
    runs-on: ubuntu-latest
    timeout-minutes: 130

    defaults:
      run:
        working-directory: Scanner

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Scanner/requirements.txt

      - name: Check trading day and time
        run: |
          python - <<'PY'
          from datetime import datetime, time
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo("Asia/Kolkata"))
          print(f"Current India time: {now:%Y-%m-%d %H:%M:%S %Z}")

          if now.weekday() >= 5:
              raise SystemExit("STOP: Saturday/Sunday. Run on a weekday.")

          if now.time() >= time(15, 10):
              raise SystemExit(
                  "STOP: It is 15:10 IST or later. "
                  "Run before the afternoon observation window ends."
              )
          PY

      - name: Install scanner dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile scanner
        run: |
          python -m py_compile afternoon_fresh_move_scanner.py
          python -m py_compile afternoon_alerts.py

      - name: Test ntfy delivery
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then
            echo "ERROR: NTFY_TOPIC secret is missing"
            exit 1
          fi

          curl --fail --show-error --silent \
            --retry 2 \
            --retry-delay 2 \
            -H "Title: Scanner delivery test" \
            -H "Priority: default" \
            -d "GitHub Actions full-universe workflow delivery test. Not a stock alert." \
            "https://ntfy.sh/${NTFY_TOPIC}"

          echo "ntfy test message accepted by server."

      - name: Run full-universe afternoon scan
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PYTHONUNBUFFERED: "1"
        run: |
          python afternoon_fresh_move_scanner.py \
            --watch \
            --group-a Group_A.csv \
            --group-b Group_B.csv \
            --smallcap bse_smallcap250_clean.csv \
            --output-dir afternoon_reports

      - name: Verify report files exist
        if: success()
        run: |
          python - <<'PY'
          from pathlib import Path

          folder = Path("afternoon_reports")
          files = [
              p for p in folder.rglob("*")
              if p.is_file() and p.stat().st_size > 0
          ] if folder.exists() else []

          for file in files:
              print(f"REPORT: {file} ({file.stat().st_size} bytes)")

          if not files:
              raise SystemExit(
                  "ERROR: Scanner completed without creating any non-empty report files."
              )
          PY

      - name: Package reports for email
        if: success()
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED

          folder = Path("afternoon_reports")
          files = [
              p for p in folder.rglob("*")
              if p.is_file() and p.stat().st_size > 0
          ]

          if not files:
              raise SystemExit("No report files available to package.")

          archive = Path("afternoon_reports_bundle.zip")
          with ZipFile(archive, "w", ZIP_DEFLATED) as zf:
              for file in files:
                  zf.write(file, file.relative_to(folder.parent))

          print(f"Created {archive} ({archive.stat().st_size} bytes)")
          PY

      - name: Email full-universe report
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "Afternoon Fresh Move Scanner - Full Universe"
          to: sa2337308@gmail.com
          from: ${{ secrets.GMAIL_USERNAME }}
          body: |
            The full-universe afternoon scanner run has completed.

            The attached ZIP contains the report files generated by the scanner.
            Check the run logs for the loaded universe count, scan cycles,
            failed data retrievals, and candidate processing.

            A successful workflow alone does not guarantee every stock had
            valid market data or that a qualifying trade candidate was found.
            This report is for research and is not a buy/sell recommendation.
          attachments: Scanner/afternoon_reports_bundle.zip

      - name: Upload full-universe reports and logs evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: afternoon-full-universe-${{ github.run_id }}
          path: |
            Scanner/afternoon_reports/
            Scanner/afternoon_reports_bundle.zip
          if-no-files-found: warn
          retention-days: 30